="tab">English</button> <button type="button" data-locale="zh" role="tab">中文</button> </div> </header> <main id="policy-root" class="policy-root" aria-live="polite"></main> </div> <script>(()=>{var c={en:{introduction:"This Privacy Policy explains how the Wingmon Chrome extension collects, uses, stores, and shares information. This policy applies only to the Wingmon extension.",sections:[{blocks:[{items:[{text:"Wingmon stores settings in chrome.storage.local, including API key, model, base URL, API type, language, and theme preferences.",title:"A. User-provided settings"},{text:"Wingmon stores conversation messages and assistant responses locally to support chat continuity and history features.",title:"B. Conversation data"},{text:"When you use page-aware features, Wingmon reads active page content, page URL/title, and interaction markers needed for automation.",title:"C. Page content and metadata"},{text:"If you use HTML preview tools, Wingmon stores preview code and timestamps locally.",title:"D. HTML preview records"}],type:"cards"},{text:"Wingmon does not run advertising analytics SDKs and does not sell personal information.",type:"paragraph"}],heading:"1. Information We Process"},{blocks:[{items:["To generate AI responses to your prompts.","To provide page-reading and browser automation capabilities.","To preserve conversation history and user preferences.","To improve reliability, debugging, and security."],type:"list"}],heading:"2. How We Use Information"},{blocks:[{text:"Wingmon processes most data locally in your browser. When you send a request to an AI model, relevant content may be transmitted to the AI provider you selected.",type:"paragraph"},{items:["OpenAI","Anthropic","Google Gemini"],type:"list"},{text:"Data sent to these providers may include your prompt, conversation context, selected page content, and tool-related context needed to generate results. These providers process data under their own terms and privacy policies.",type:"paragraph"}],heading:"3. Sharing and External Processing"},{blocks:[{items:["storage: save settings and local conversation records.","tabs / tabGroups / webNavigation / scripting: read and interact with web pages.","sidePanel / contextMenus / downloads / offscreen: support extension UI, actions, and runtime workflows.","host permissions (<all_urls>): allow page extraction and automation on pages where you use Wingmon."],type:"list"}],heading:"4. Chrome Permissions and Why They Are Used"},{blocks:[{items:["Conversation history is stored locally with an internal cap.","HTML previews are stored locally with an internal cap.","Settings remain locally stored until you change them or uninstall the extension."],type:"list"},{text:"You can clear data by deleting conversation records and uninstalling the extension, which removes extension local storage from your browser.",type:"paragraph"}],heading:"5. Data Retention"},{blocks:[{text:"We use browser-provided local storage and extension isolation mechanisms to reduce unauthorized access risks. No method of transmission or storage is completely secure.",type:"paragraph"}],heading:"6. Security"},{blocks:[{text:"Wingmon is not directed to children under 13, and we do not intentionally collect personal data from children.",type:"paragraph"}],heading:"7. Children\u2019s Privacy"},{blocks:[{text:"If you choose an external AI provider, data may be processed on servers in other countries according to that provider\u2019s policies.",type:"paragraph"}],heading:"8. International Data Transfers"},{blocks:[{text:"If information is received from Google APIs, Wingmon handles it under the Google API Services User Data Policy and its Limited Use requirements.",type:"paragraph"}],heading:"9. Google API Services"},{blocks:[{text:"We may update this policy from time to time. Updated versions will be published on this page with a revised date.",type:"paragraph"}],heading:"10. Changes to This Policy"},{blocks:[{text:"For privacy questions or requests, please contact the developer through the support channel listed on the Wingmon Chrome Web Store page.",type:"paragraph"}],heading:"11. Contact"}],title:"Privacy Policy for Wingmon",updatedAt:"Last updated: February 17, 2026 (UTC)"},zh:{introduction:"\u672C\u9690\u79C1\u6743\u653F\u7B56\u8BF4\u660E Wingmon Chrome \u6269\u5C55\u5982\u4F55\u6536\u96C6\u3001\u4F7F\u7528\u3001\u5B58\u50A8\u548C\u5171\u4EAB\u4FE1\u606F\u3002\u8BE5\u653F\u7B56\u4EC5\u9002\u7528\u4E8E Wingmon \u6269\u5C55\u672C\u8EAB\u3002",sections:[{blocks:[{items:[{text:"Wingmon \u4F1A\u5728 chrome.storage.local \u4E2D\u4FDD\u5B58\u8BBE\u7F6E\u9879\uFF0C\u5305\u62EC API Key\u3001\u6A21\u578B\u3001Base URL\u3001API \u7C7B\u578B\u3001\u8BED\u8A00\u548C\u4E3B\u9898\u504F\u597D\u7B49\u3002",title:"A. \u7528\u6237\u63D0\u4F9B\u7684\u8BBE\u7F6E\u6570\u636E"},{text:"\u4E3A\u652F\u6301\u4F1A\u8BDD\u8FDE\u7EED\u6027\u548C\u5386\u53F2\u8BB0\u5F55\u529F\u80FD\uFF0CWingmon \u4F1A\u5728\u672C\u5730\u4FDD\u5B58\u7528\u6237\u6D88\u606F\u4E0E\u52A9\u624B\u56DE\u590D\u3002",title:"B. \u5BF9\u8BDD\u6570\u636E"},{text:"\u5F53\u4F60\u4F7F\u7528\u4E0E\u9875\u9762\u76F8\u5173\u7684\u529F\u80FD\u65F6\uFF0CWingmon \u4F1A\u8BFB\u53D6\u5F53\u524D\u9875\u9762\u5185\u5BB9\u3001\u9875\u9762 URL/\u6807\u9898\uFF0C\u4EE5\u53CA\u6267\u884C\u81EA\u52A8\u5316\u6240\u9700\u7684\u4EA4\u4E92\u6807\u8BB0\u3002",title:"C. \u9875\u9762\u5185\u5BB9\u4E0E\u5143\u6570\u636E"},{text:"\u5F53\u4F60\u4F7F\u7528 HTML \u9884\u89C8\u5DE5\u5177\u65F6\uFF0CWingmon \u4F1A\u5728\u672C\u5730\u4FDD\u5B58\u9884\u89C8\u4EE3\u7801\u4E0E\u65F6\u95F4\u6233\u3002",title:"D. HTML \u9884\u89C8\u8BB0\u5F55"}],type:"cards"},{text:"Wingmon \u4E0D\u96C6\u6210\u5E7F\u544A\u5206\u6790 SDK\uFF0C\u4E5F\u4E0D\u4F1A\u51FA\u552E\u4E2A\u4EBA\u4FE1\u606F\u3002",type:"paragraph"}],heading:"1. \u6211\u4EEC\u5904\u7406\u7684\u4FE1\u606F"},{blocks:[{items:["\u4E3A\u4F60\u7684\u63D0\u793A\u8BCD\u751F\u6210 AI \u56DE\u590D\u3002","\u63D0\u4F9B\u7F51\u9875\u8BFB\u53D6\u4E0E\u6D4F\u89C8\u5668\u81EA\
